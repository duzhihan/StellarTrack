  <text x="690" y="676" text-anchor="middle" font-family="FangSong,'STFangsong','FangSong_GB2312','SimSun',serif" font-size="16" font-weight="bold" fill="#333333">复盘本篇：置信 ≥3 的真反馈才回写规则库</text>
  <text x="690" y="700" text-anchor="middle" font-family="FangSong,'STFangsong','FangSong_GB2312','SimSun',serif" font-size="15" font-weight="bold" fill="#555555">期刊退修这类反馈算硬分，自我感觉不算——下次开工自动带上</text>

  <!-- footer support line -->
  <text x="620" y="758" text-anchor="middle" font-family="FangSong,'STFangsong','FangSong_GB2312','SimSun',serif" font-size="16" font-weight="bold" fill="#444444">全程支撑：M 方法库（怎么写的菜谱） · K 知识库（按需检索，不预存） · T 工具箱（作图／查证／排版）</text>
