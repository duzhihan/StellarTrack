  <text x="534" y="334" text-anchor="middle" font-family="'Times New Roman',Arial,sans-serif" font-size="15" fill="#2456A6">C3</text>
  <text x="534" y="362" text-anchor="middle" font-family="SimHei,'Heiti SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" fill="#111111">综述·引言</text>

  <rect x="640" y="308" width="132" height="72" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="706" y="334" text-anchor="middle" font-family="'Times New Roman',Arial,sans-serif" font-size="15" fill="#2456A6">C4</text>
  <text x="706" y="362" text-anchor="middle" font-family="SimHei,'Heiti SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" fill="#111111">大纲协商</text>

  <rect x="812" y="308" width="132" height="72" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="878" y="334" text-anchor="middle" font-family="'Times New Roman',Arial,sans-serif" font-size="15" fill="#2456A6">C5</text>
