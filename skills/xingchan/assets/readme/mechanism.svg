  <rect x="80" y="248" width="1080" height="330" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
  <text x="104" y="285" font-family="SimHei,'Heiti SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="22" fill="#2456A6">C · 建构</text>
  <text x="232" y="284" font-family="FangSong,'STFangsong','FangSong_GB2312','SimSun',serif" font-size="17" font-weight="bold" fill="#444444">十一道工序，线性推进，不可跳步</text>

