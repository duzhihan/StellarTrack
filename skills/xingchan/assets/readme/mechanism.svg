  <text x="1160" y="67" text-anchor="end" font-family="FangSong,'STFangsong','FangSong_GB2312','SimSun',serif" font-size="15" font-weight="bold" fill="#444444">编号圆＝验收闸：不过即挂起，等你放行</text>
  <circle cx="868" cy="61" r="10" fill="#2456A6"/>
  <text x="868" y="66" text-anchor="middle" font-size="12" fill="#ffffff">①</text>

  <!-- top band: input, O, gate1, S, gate2, output -->
  <rect x="118" y="100" width="130" height="92" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
  <text x="183" y="140" text-anchor="middle" font-family="SimHei,'Heiti SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="20" fill="#111111">你的需求</text>
  <text x="183" y="168" text-anchor="middle" font-family="FangSong,'STFangsong','FangSong_GB2312','SimSun',serif" font-size="15" font-weight="bold" fill="#555555">一句话＋场景</text>

  <line x1="250" y1="146" x2="278" y2="146" stroke="#000000" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="282" y="100" width="240" height="92" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
  <text x="402" y="133" text-anchor="middle" font-family="SimHei,'Heiti SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" fill="#2456A6">O · 定向</text>
  <text x="402" y="160" text-anchor="middle" font-family="FangSong,'STFangsong','FangSong_GB2312','SimSun',serif" font-size="16" font-weight="bold" fill="#333333">O1 场景识别 ≤2 问</text>
  <text x="402" y="184" text-anchor="middle" font-family="FangSong,'STFangsong','FangSong_GB2312','SimSun',serif" font-size="16" font-weight="bold" fill="#333333">O2 十变量契约，你拍板</text>

  <line x1="524" y1="146" x2="586" y2="146" stroke="#000000" stroke-width="1.6"/>
  <circle cx="555" cy="146" r="13" fill="#2456A6"/>
  <text x="555" y="151" text-anchor="middle" font-size="14" fill="#ffffff">①</text>

  <rect x="588" y="100" width="250" height="92" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
  <text x="713" y="133" text-anchor="middle" font-family="SimHei,'Heiti SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" fill="#2456A6">S · 运思</text>
  <text x="713" y="160" text-anchor="middle" font-family="FangSong,'STFangsong','FangSong_GB2312','SimSun',serif" font-size="16" font-weight="bold" fill="#333333">元层 → 六环 → 验证</text>
  <text x="713" y="184" text-anchor="middle" font-family="FangSong,'STFangsong','FangSong_GB2312','SimSun',serif" font-size="16" font-weight="bold" fill="#333333">想透「论证往哪走」</text>

  <line x1="840" y1="146" x2="890" y2="146" stroke="#000000" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="865" cy="146" r="13" fill="#2456A6"/>
  <text x="865" y="151" text-anchor="middle" font-size="14" fill="#ffffff">②</text>

  <rect x="892" y="100" width="230" height="92" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
  <text x="1007" y="133" text-anchor="middle" font-family="SimHei,'Heiti SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" fill="#111111">双产出</text>
  <text x="1007" y="160" text-anchor="middle" font-family="FangSong,'STFangsong','FangSong_GB2312','SimSun',serif" font-size="16" font-weight="bold" fill="#333333">论证锚定卡 ＋ 结果稿</text>
  <text x="1007" y="184" text-anchor="middle" font-family="FangSong,'STFangsong','FangSong_GB2312','SimSun',serif" font-size="15" font-weight="bold" fill="#333333">写什么、怎么想，先立字据</text>

