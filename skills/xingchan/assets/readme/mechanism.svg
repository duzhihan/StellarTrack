  <rect x="984" y="308" width="132" height="72" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="1050" y="334" text-anchor="middle" font-family="'Times New Roman',Arial,sans-serif" font-size="15" fill="#2456A6">C6</text>
