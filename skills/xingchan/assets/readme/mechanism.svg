  <text x="534" y="476" text-anchor="middle" font-family="'Times New Roman',Arial,sans-serif" font-size="15" fill="#2456A6">C10</text>
  <text x="534" y="504" text-anchor="middle" font-family="SimHei,'Heiti SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" fill="#111111">返修</text>

