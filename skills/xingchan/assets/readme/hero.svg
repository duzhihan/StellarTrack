  <text x="1160" y="328" text-anchor="end" font-family="FangSong,'STFangsong','FangSong_GB2312','SimSun',serif" font-size="15" font-weight="bold" fill="#666666">十三道验收闸全程编号留痕 · 不过即挂起，等你放行</text>
