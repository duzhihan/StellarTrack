      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1240" height="340" rx="18" fill="#ffffff" stroke="#d9dde6" stroke-width="1"/>

  <!-- title block -->
  <text x="76" y="124" font-family="SimHei,'Heiti SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="58" fill="#111111" letter-spacing="4">星躔</text>
  <text x="234" y="118" font-family="'Times New Roman',Arial,sans-serif" font-size="34" fill="#2456A6" letter-spacing="1">StellarTrack</text>
  <text x="78" y="172" font-family="SimHei,'Heiti SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="23" fill="#222222">一条带闸门的写作流水线：AI 出力，你放行。</text>
  <text x="78" y="206" font-family="FangSong,'STFangsong','FangSong_GB2312','SimSun',serif" font-size="17" font-weight="bold" fill="#555555">跨场景写作管线 · 六种文体，同一条流水线</text>

