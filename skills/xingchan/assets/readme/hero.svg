  <line x1="269" y1="269" x2="311" y2="269" stroke="#000000" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="290" cy="269" r="12" fill="#2456A6"/>
  <text x="290" y="274" text-anchor="middle" font-size="13" fill="#ffffff">①</text>

  <rect x="315" y="238" width="150" height="62" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
  <text x="390" y="276" text-anchor="middle" font-family="SimHei,'Heiti SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" fill="#111111"><tspan fill="#2456A6">S</tspan> 运思</text>

  <line x1="467" y1="269" x2="509" y2="269" stroke="#000000" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="488" cy="269" r="12" fill="#2456A6"/>
  <text x="488" y="274" text-anchor="middle" font-size="13" fill="#ffffff">②</text>

  <rect x="513" y="238" width="240" height="62" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
  <text x="633" y="264" text-anchor="middle" font-family="SimHei,'Heiti SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" fill="#111111"><tspan fill="#2456A6">C</tspan> 建构</text>
  <text x="633" y="288" text-anchor="middle" font-family="FangSong,'STFangsong','FangSong_GB2312','SimSun',serif" font-size="14" font-weight="bold" fill="#444444">C1–C11 · 内含③–⑫号闸</text>

  <line x1="755" y1="269" x2="797" y2="269" stroke="#000000" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="776" cy="269" r="12" fill="#2456A6"/>
  <text x="776" y="274" text-anchor="middle" font-size="13" fill="#ffffff">⑬</text>

  <rect x="801" y="238" width="150" height="62" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
  <text x="876" y="276" text-anchor="middle" font-family="SimHei,'Heiti SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" fill="#111111"><tspan fill="#2456A6">E</tspan> 沉淀</text>

  <line x1="953" y1="269" x2="995" y2="269" stroke="#000000" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="999" y="238" width="140" height="62" rx="31" fill="#f4f6fa" stroke="#000000" stroke-width="1.6"/>
