<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">StellarTrack hero</title>
  <desc id="desc">星躔（StellarTrack）：把散落的思考，沿既定星轨，写成站得住的论文。</desc>

  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="1"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="300" rx="16" fill="#f6f8fa"/>
  <rect x="6" y="6" width="1188" height="288" rx="12" fill="none" stroke="#d0d7de" stroke-width="2"/>

  <!-- 左：散落的星点（素材与想法） -->
  <g transform="translate(150,150)">
    <circle cx="-60" cy="-52" r="5" fill="#4f46e5" opacity="0.35"/>
    <circle cx="42" cy="-70" r="4" fill="#4f46e5" opacity="0.28"/>
    <circle cx="-78" cy="30" r="4" fill="#4f46e5" opacity="0.30"/>
    <circle cx="66" cy="44" r="5" fill="#d97706" opacity="0.45"/>
    <circle cx="-20" cy="72" r="3.5" fill="#4f46e5" opacity="0.25"/>
    <circle cx="80" cy="-24" r="3" fill="#4f46e5" opacity="0.22"/>
    <circle r="86" fill="none" stroke="#4f46e5" stroke-width="1.2" stroke-dasharray="4 7" opacity="0.30"/>
    <text x="0" y="122" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="17" fill="#57606a">散落的想法与文献</text>
  </g>

  <!-- 光束 -->
  <line x1="250" y1="150" x2="430" y2="150" stroke="url(#beam)" stroke-width="3.5" marker-end="url(#ah)"/>

  <!-- 中：星盘（O-S-C-E 管线） -->
  <g transform="translate(520,150)">
    <circle r="72" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
    <circle r="50" fill="none" stroke="#4f46e5" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.55"/>
    <line x1="-46" y1="26" x2="40" y2="-38" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="6" fill="#4f46e5"/>
    <text x="0" y="98" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="19" font-weight="bold" fill="#1f2328">星躔 · StellarTrack</text>
  </g>

  <!-- 光束 -->
  <line x1="610" y1="150" x2="720" y2="150" stroke="url(#beam)" stroke-width="3.5" marker-end="url(#ah)"/>

  <!-- 右：四段 O-S-C-E -->
  <g font-family="'Segoe UI',sans-serif">
    <g>
      <rect x="750" y="38" width="380" height="48" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
      <text x="772" y="68" font-size="18" font-weight="bold" fill="#4f46e5">O</text>
      <text x="800" y="68" font-size="16" fill="#1f2328">目标定向 —— 把模糊意图收敛成真问题</text>
    </g>
    <g>
      <rect x="750" y="96" width="380" height="48" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
      <text x="772" y="126" font-size="18" font-weight="bold" fill="#4f46e5">S</text>
      <text x="800" y="126" font-size="16" fill="#1f2328">思考决策 —— 判断句先行，廉价证伪试杀</text>
    </g>
    <g>
      <rect x="750" y="154" width="380" height="48" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
      <text x="772" y="184" font-size="18" font-weight="bold" fill="#d97706">C</text>
      <text x="800" y="184" font-size="16" fill="#1f2328">认知建构 —— C1–C11 工序流水线带号流转</text>
    </g>
    <g>
      <rect x="750" y="212" width="380" height="48" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
      <text x="772" y="242" font-size="18" font-weight="bold" fill="#4f46e5">E</text>
      <text x="800" y="242" font-size="16" fill="#1f2328">经验共创 —— 校准台账让系统越用越准</text>
    </g>
  </g>
</svg>
