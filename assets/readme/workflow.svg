<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" role="img" aria-labelledby="wtitle wdesc">
  <title id="wtitle">StellarTrack workflow</title>
  <desc id="wdesc">C1–C11 认知建构流水线：定靶→备料→立骨→搭架→填充→打磨→净化→合卷→会审→返修→归档，关键工序设守门。</desc>

  <rect x="0" y="0" width="1200" height="260" rx="16" fill="#f6f8fa"/>
  <rect x="6" y="6" width="1188" height="248" rx="12" fill="none" stroke="#d0d7de" stroke-width="2"/>

  <text x="600" y="46" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#1f2328">C 层 · 认知建构流水线（换文体只换装载，不换流水线）</text>

  <defs>
    <marker id="wah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- 主线 -->
  <line x1="70" y1="130" x2="1130" y2="130" stroke="#d0d7de" stroke-width="3"/>

  <!-- 11 个工序节点 -->
  <g font-family="'Segoe UI',sans-serif" text-anchor="middle">
    <g transform="translate(80,130)">
      <circle r="22" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/><text y="-34" font-size="13" fill="#57606a">C1</text><text y="5" font-size="14" font-weight="bold" fill="#1f2328">定靶</text>
    </g>
    <g transform="translate(180,130)">
      <circle r="22" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/><text y="-34" font-size="13" fill="#57606a">C2</text><text y="5" font-size="14" font-weight="bold" fill="#1f2328">备料</text>
    </g>
    <g transform="translate(280,130)">
      <circle r="22" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/><text y="-34" font-size="13" fill="#57606a">C3</text><text y="5" font-size="14" font-weight="bold" fill="#1f2328">立骨</text>
    </g>
    <g transform="translate(380,130)">
      <circle r="22" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/><text y="-34" font-size="13" fill="#57606a">C4</text><text y="5" font-size="14" font-weight="bold" fill="#1f2328">搭架</text>
    </g>
    <g transform="translate(480,130)">
      <circle r="22" fill="#fff7ed" stroke="#d97706" stroke-width="2.5"/><text y="-34" font-size="13" fill="#b45309">C5</text><text y="5" font-size="14" font-weight="bold" fill="#1f2328">填充</text><path d="M-9,-30 l4,4 6,-8" stroke="#d97706" stroke-width="2.5" fill="none"/>
    </g>
    <g transform="translate(580,130)">
      <circle r="22" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/><text y="-34" font-size="13" fill="#57606a">C6</text><text y="5" font-size="14" font-weight="bold" fill="#1f2328">打磨</text>
    </g>
    <g transform="translate(680,130)">
      <circle r="22" fill="#fff7ed" stroke="#d97706" stroke-width="2.5"/><text y="-34" font-size="13" fill="#b45309">C7</text><text y="5" font-size="14" font-weight="bold" fill="#1f2328">净化</text><path d="M-9,-30 l4,4 6,-8" stroke="#d97706" stroke-width="2.5" fill="none"/>
    </g>
    <g transform="translate(780,130)">
      <circle r="22" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/><text y="-34" font-size="13" fill="#57606a">C8</text><text y="5" font-size="14" font-weight="bold" fill="#1f2328">合卷</text>
    </g>
    <g transform="translate(880,130)">
      <circle r="22" fill="#fff7ed" stroke="#d97706" stroke-width="2.5"/><text y="-34" font-size="13" fill="#b45309">C9</text><text y="5" font-size="14" font-weight="bold" fill="#1f2328">会审</text><path d="M-9,-30 l4,4 6,-8" stroke="#d97706" stroke-width="2.5" fill="none"/>
    </g>
    <g transform="translate(980,130)">
      <circle r="22" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/><text y="-34" font-size="13" fill="#57606a">C10</text><text y="5" font-size="14" font-weight="bold" fill="#1f2328">返修</text>
    </g>
    <g transform="translate(1090,130)">
      <circle r="22" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/><text y="-34" font-size="13" fill="#4f46e5">C11</text><text y="5" font-size="14" font-weight="bold" fill="#1f2328">归档</text>
    </g>
  </g>

  <!-- 底部说明 -->
  <g font-family="'Segoe UI',sans-serif" font-size="14" fill="#57606a">
    <rect x="330" y="196" width="14" height="14" rx="3" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
    <text x="352" y="208">橙色＝设守门的工序（产物不过门，不进下一站）</text>
    <rect x="700" y="196" width="14" height="14" rx="3" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="722" y="208">每个工序产出带号流转（如 C1-xxx），可追溯、可续作</text>
  </g>
</svg>
